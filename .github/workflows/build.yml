name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Abrir o zip do projeto
        run: |
          rm -rf project
          mkdir project
          unzip -q voicehunter.zip -d project
          ls project/voicehunter
      - name: Build
        working-directory: project/voicehunter
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: voicehunter-jar
          path: project/voicehunter/build/libs/*.jar
